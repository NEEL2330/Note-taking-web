name: Phase 1 - Build and Publish to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (highly recommended for better caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build the image and push it to Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
      
      # Step 5: Clone your K8s Manifest Repository onto the same runner
      - name: Checkout Kubernetes Repository
        uses: actions/checkout@v4
        with:
          # Your target Kubernetes repo path
          repository: NEEL2330/Kubernetes
          # The Personal Access Token giving write access to that repo
          token: ${{ secrets.CROSS_REPO_PAT }}
          # Downloads the K8s code into a separate subfolder named 'k8s-repo'
          path: k8s-repo

      # Step 6: Modify the deployment file directly inside the cloned subfolder
      - name: Update Image Tag in Kubernetes Manifest
        run: |
          NEW_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}"
          echo "Updating deployment with image: $NEW_IMAGE"
          
          # Use sed to directly target and swap out your placeholder string
          sed -i "s|image:.*|image: $NEW_IMAGE|g" k8s-repo/deployment.yaml

      # Step 7: Push the updated file back to the Kubernetes repository
      - name: Commit and Push to Kubernetes Repo
        run: |
          cd k8s-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "chore: automated deployment image update to tag ${{ github.sha }}"
          git push origin main