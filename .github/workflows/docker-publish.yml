name: Phase 1 - Build and Publish to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (highly recommended for better caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build the image and push it to Docker Hub
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
      
      # Step 5: Trigger the second repository to update its K8s manifest
      - name: Notify Second Repository
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: NEEL2330/Kubernetes
          event-type: update-k8s-manifest
          # Sending the clean registry path and the unique commit SHA tag
          client-payload: '{"image_name": "${{ secrets.DOCKERHUB_USERNAME }}/my-app", "tag": "${{ github.sha }}"}'